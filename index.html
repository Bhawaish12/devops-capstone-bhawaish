<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhawaish | DevOps Capstone</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 760px;
      padding: 48px 32px;
      border: 1px solid #334155;
      border-radius: 20px;
      background: #1e293b;
      text-align: center;
    }
    .label {
      color: #38bdf8;
      font-weight: bold;
      letter-spacing: 2px;
    }
    h1 { font-size: clamp(32px, 6vw, 52px); }
    p { line-height: 1.7; }
    .tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
    }
    .tools span {
      padding: 10px 14px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #475569;
    }
  </style>
</head>
<body>
  <main>
    <p class="label">DEVOPS CAPSTONE PROJECT</p>
    <h1>Hello, I am Bhawaish!</h1>
    <p>
      A simple website served by Nginx inside a Docker container.
      This project demonstrates version control, continuous integration,
      and deployment automation.
    </p>
    <div class="tools">
      <span>Linux</span>
      <span>Git &amp; GitHub</span>
      <span>Docker</span>
      <span>GitHub Actions</span>
      <span>Jenkins</span>
    </div>
  </main>
</body>
</html>
